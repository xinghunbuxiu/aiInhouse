# Kujiale wall segmentation — Apple MPS
seed: 42
image_size: 512
batch_size: 4
epochs: 30
lr: 0.0003
weight_decay: 0.0001
num_workers: 0
train_ratio: 0.9
encoder: resnet34
encoder_weights: imagenet
classes: 1
# input prefers withoutDimensionLine (same canvas as wallCenterLine)
input_view: withoutDimensionLine.jpg
label_view: wallCenterLine.jpg
fallback_input: imageUrl.jpg
data_root: ../backend/uploads/floorplans/kujiale-3d
dataset_dir: ./data/kujiale-wall
runs_dir: ./runs
device: mps
early_stop_patience: 6
amp: false
