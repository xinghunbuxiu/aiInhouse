name: Floorplan to 3D verification

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:2d3d
      # Run the real recognition pipeline on a checked-in image, not just synthetic fixtures.
      - name: Run sample floor-plan recognition
        run: node scripts/batch-recognition-sample.mjs --image "./WX20260329-112615@2x.png" --output "./tmp/sample-floorplan-eval"
      - name: Upload sample recognition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-floorplan-recognition-report
          path: tmp/sample-floorplan-eval/summary.json
          if-no-files-found: warn
      - run: npm run build
